name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo install cargo-bundle-licenses --version 4.2.0 --locked
      - run: cargo bundle-licenses --format yaml --output THIRDPARTY.yml

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIR="rs-peekaboo-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${DIR}"
          cp "target/${{ matrix.target }}/release/rs-peekaboo" "${DIR}/"
          cp LICENSE THIRDPARTY.yml "${DIR}/"
          tar czf "${DIR}.tar.gz" "${DIR}"
          openssl dgst -sha256 -r "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "${GITHUB_ENV}"
          echo "ASSET_SHA=${DIR}.tar.gz.sha256" >> "${GITHUB_ENV}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DIR = "rs-peekaboo-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $DIR -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rs-peekaboo.exe" -Destination "$DIR/"
          Copy-Item "LICENSE", "THIRDPARTY.yml" -Destination "$DIR/"
          Compress-Archive -Path "$DIR/*" -DestinationPath "$DIR.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$DIR.zip").Hash.ToLower()
          "$hash  $DIR.zip" | Out-File -FilePath "$DIR.zip.sha256" -Encoding ascii
          echo "ASSET=$DIR.zip" >> $env:GITHUB_ENV
          echo "ASSET_SHA=$DIR.zip.sha256" >> $env:GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          generate_release_notes: true

  publish:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if cargo info "rs_peekaboo@${VERSION}" >/dev/null 2>&1; then
            echo "rs_peekaboo ${VERSION} is already published"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
