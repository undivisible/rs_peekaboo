name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rs_peekaboo") | .version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

  release:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: cargo install cargo-bundle-licenses --version 4.2.0 --locked
      - run: cargo bundle-licenses --format yaml --output THIRDPARTY.yml

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIR="rs-peekaboo-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${DIR}"
          cp "target/${{ matrix.target }}/release/rs-peekaboo" "${DIR}/"
          cp LICENSE THIRDPARTY.yml "${DIR}/"
          tar czf "${DIR}.tar.gz" "${DIR}"
          openssl dgst -sha256 -r "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ASSET=${DIR}.tar.gz" >> "${GITHUB_ENV}"
          echo "ASSET_SHA=${DIR}.tar.gz.sha256" >> "${GITHUB_ENV}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DIR = "rs-peekaboo-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $DIR -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rs-peekaboo.exe" -Destination "$DIR/"
          Copy-Item "LICENSE", "THIRDPARTY.yml" -Destination "$DIR/"
          Compress-Archive -Path "$DIR/*" -DestinationPath "$DIR.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$DIR.zip").Hash.ToLower()
          "$hash  $DIR.zip" | Out-File -FilePath "$DIR.zip.sha256" -Encoding ascii
          echo "ASSET=$DIR.zip" >> $env:GITHUB_ENV
          echo "ASSET_SHA=$DIR.zip.sha256" >> $env:GITHUB_ENV

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  github_release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all release assets
        shell: bash
        run: |
          cd dist
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            suffix=tar.gz
            if [ "$target" = x86_64-pc-windows-msvc ]; then suffix=zip; fi
            asset="rs-peekaboo-${GITHUB_REF_NAME}-${target}.${suffix}"
            test -f "$asset"
            test -f "$asset.sha256"
            read -r expected _ < "$asset.sha256"
            printf '%s  %s\n' "$expected" "$asset" | sha256sum --check
          done
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
