[package]
name = "rs_peekaboo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native macOS automation crate inspired by Peekaboo"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
