[package]
name = "rs_peekaboo"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "Rust-native cross-platform computer-use CLI and library"
readme = "README.md"
repository = "https://github.com/undivisible/rs_peekaboo"
homepage = "https://github.com/undivisible/rs_peekaboo"
documentation = "https://docs.rs/rs_peekaboo"
keywords = ["automation", "accessibility", "cli", "computer-use", "cross-platform"]
categories = ["command-line-utilities"]

[[bin]]
name = "rs-peekaboo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
